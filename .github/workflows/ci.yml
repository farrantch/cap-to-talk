name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,desktop]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pip-audit
      - run: python -m build

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes libportaudio2 libegl1 libopengl0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,desktop]'
      - run: pytest

  portable-core:
    name: Desktop adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,desktop]"
      # Includes native SDK import/binding smoke tests without grabbing input.
      # Linux jobs cover these shell installers and the X11 launch script.
      - run: >-
          python -m pytest
          --ignore=tests/test_install.py
          --ignore=tests/test_install_user.py
          --ignore=tests/test_start.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: bash -n install.sh uninstall.sh scripts/*.sh
      - run: shellcheck install.sh uninstall.sh scripts/*.sh
